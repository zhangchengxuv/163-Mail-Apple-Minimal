<!doctype html>
<html lang="zh-CN">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>163 Mail Minimal</title></head>
  <body>
    <main class="panel">
      <header class="brand"><img id="brand-icon" width="40" height="40" alt="" /><div><h1>163 Mail Minimal</h1><p>简洁、安全的网易邮箱体验</p></div></header>
      <p id="site-status" class="status" role="status">正在检查当前页面…</p>
      <section class="card feature"><div><h2>界面净化</h2><p>广告、AI 和推广入口</p></div><label class="switch"><input aria-label="启用界面净化" type="checkbox" data-setting="cleanerEnabled"><span></span></label></section>
      <section class="card feature"><div><h2>Apple Mail 外观</h2><p>顶部、侧栏和邮件列表</p></div><label class="switch"><input aria-label="启用 Apple Mail 外观" type="checkbox" data-setting="themeEnabled"><span></span></label></section>
      <section class="card homepage"><h2>首页行为</h2><label><input type="radio" name="homepageMode" value="inbox"><span>直接进入收件箱</span></label><label><input type="radio" name="homepageMode" value="minimal-home"><span>极简首页</span></label><label><input type="radio" name="homepageMode" value="original-home"><span>网易原版首页</span></label></section>
      <footer><button id="advanced" type="button">高级设置</button><button id="reset" type="button">恢复默认</button><span id="version"></span></footer>
    </main>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
